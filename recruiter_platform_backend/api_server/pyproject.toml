[project]
name = "api-server"
version = "0.1.0"
description = "Recruitment platform API — LangGraph MAS, gRPC DB facade, MinIO, pgvector"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "boto3>=1.35.0",
    "fastapi>=0.136.1",
    "grpcio>=1.68.0",
    "httpx>=0.28.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=1.1.10",
    "mcp>=1.27.0",
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-ollama>=0.4.0",
    "llama-index-readers-file>=0.4.0",
    "pgvector>=0.3.6",
    "pymupdf>=1.25.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.46.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: optional tests that require external services (e.g. Ollama for LLM-as-judge)",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.68.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "hypothesis>=6.0.0",
]

